# Observability Stack for Cartridge
# This docker-compose file sets up Prometheus, Grafana, Loki, and Tempo for monitoring

version: '3.8'

networks:
  cartridge:
    name: cartridge_network
    external: true
  observability:
    name: observability_network
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:

services:
  # Prometheus - Metrics collection and storage
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks:
      - observability
      - cartridge
    restart: unless-stopped

  # Grafana - Visualization and dashboards
  grafana:
    image: grafana/grafana:10.2.2
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - observability
    depends_on:
      - prometheus
    restart: unless-stopped

  # Loki - Log aggregation
  loki:
    image: grafana/loki:2.9.3
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks:
      - observability
    restart: unless-stopped

  # Promtail - Log shipper for Loki (optional, for future use)
  # Uncomment when you want to enable log collection
  # promtail:
  #   image: grafana/promtail:2.9.3
  #   container_name: promtail
  #   command: -config.file=/etc/promtail/config.yml
  #   volumes:
  #     - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
  #     - /var/log:/var/log:ro
  #     - /var/lib/docker/containers:/var/lib/docker/containers:ro
  #   networks:
  #     - observability
  #   depends_on:
  #     - loki
  #   restart: unless-stopped

  # Tempo - Distributed tracing (for future use)
  tempo:
    image: grafana/tempo:2.3.1
    container_name: tempo
    command: [ "-config.file=/etc/tempo/tempo.yaml" ]
    ports:
      - "3200:3200"   # Tempo HTTP
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - ./tempo/tempo-config.yml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks:
      - observability
    restart: unless-stopped

  # AlertManager - Alert routing and management (optional, for future use)
  # Uncomment when you want to enable alerting
  # alertmanager:
  #   image: prom/alertmanager:v0.26.0
  #   container_name: alertmanager
  #   command:
  #     - '--config.file=/etc/alertmanager/config.yml'
  #     - '--storage.path=/alertmanager'
  #   ports:
  #     - "9093:9093"
  #   volumes:
  #     - ./alertmanager/config.yml:/etc/alertmanager/config.yml:ro
  #     - alertmanager-data:/alertmanager
  #   networks:
  #     - observability
  #   restart: unless-stopped

  # Node Exporter - Host metrics (optional)
  # Uncomment to monitor host system metrics
  # node-exporter:
  #   image: prom/node-exporter:v1.7.0
  #   container_name: node-exporter
  #   command:
  #     - '--path.rootfs=/host'
  #   pid: host
  #   ports:
  #     - "9100:9100"
  #   volumes:
  #     - '/:/host:ro,rslave'
  #   networks:
  #     - observability
  #   restart: unless-stopped
