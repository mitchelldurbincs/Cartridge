# Grafana configuration for Cartridge observability

[server]
protocol = http
http_addr = 0.0.0.0
http_port = 3000
domain = localhost
root_url = %(protocol)s://%(domain)s:%(port)s/

[database]
type = sqlite3
path = /var/lib/grafana/grafana.db

[security]
# Default admin credentials (CHANGE IN PRODUCTION!)
admin_user = admin
admin_password = admin

# Allow embedding dashboards
allow_embedding = true

[users]
# Allow users to sign up
allow_sign_up = false
allow_org_create = false
auto_assign_org = true
auto_assign_org_role = Viewer

[auth.anonymous]
# Enable anonymous access for local development
enabled = true
org_name = Main Org.
org_role = Viewer

[dashboards]
# Dashboard versioning
versions_to_keep = 20

[analytics]
reporting_enabled = false
check_for_updates = false

[log]
mode = console
level = info

[log.console]
format = json

[metrics]
enabled = true
interval_seconds = 10

[feature_toggles]
enable = publicDashboards

[unified_alerting]
enabled = true
