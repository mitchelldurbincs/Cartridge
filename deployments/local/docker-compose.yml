services:
  engine:
    build:
      context: ../..
      dockerfile: dockerfiles/rust.Dockerfile
      args:
        SERVICE_NAME: engine-rust
        BINARY_NAME: engine-server
        USER_NAME: engine
    image: cartridge/engine-rust:local
    environment:
      ENGINE_SERVER_ADDR: 0.0.0.0:50051
      ENGINE_METRICS_ADDR: 0.0.0.0:9000
    ports:
      - "50051:50051"
      - "9000:9000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:9000/metrics || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - cartridge

  replay:
    build:
      context: ../..
      dockerfile: services/replay-go/Dockerfile
    image: cartridge/replay-go:local
    command: ["replay-server", "-port", "8080", "-max-size", "200000"]
    environment:
      REPLAY_PORT: "8080"
      REPLAY_MAX_SIZE: "200000"
      REPLAY_METRICS_PORT: "9090"
    ports:
      - "8081:8080"
      - "9100:9090"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/metrics > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cartridge

  orchestrator:
    build:
      context: ../..
      dockerfile: dockerfiles/go.Dockerfile
      args:
        SERVICE_NAME: orchestrator-go
        BINARY_NAME: orchestrator
        BUILD_HEALTHCHECK: "true"
    image: cartridge/orchestrator-go:local
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      READ_TIMEOUT: 30s
      WRITE_TIMEOUT: 30s
      SHUTDOWN_TIMEOUT: 30s
      NATS_URL: nats://localhost:4222
      NATS_SUBJECT: run-status
      HEALTH_CHECK_INTERVAL: 15s
      HEARTBEAT_STALE_AFTER: 45s
      HEARTBEAT_UNRESPONSIVE: 135s
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/orchestrator-healthcheck", "--addr", "http://localhost:8080/metrics", "--timeout", "5s"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      engine:
        condition: service_healthy
      replay:
        condition: service_healthy
    networks:
      - cartridge

  weights:
    build:
      context: ../..
      dockerfile: dockerfiles/go.Dockerfile
      args:
        SERVICE_NAME: weights-go
        BINARY_NAME: weights
        BUILD_HEALTHCHECK: "false"
    image: cartridge/weights-go:local
    environment:
      WEIGHTS_REDIS_ENABLED: "true"
      WEIGHTS_REDIS_ADDRESS: redis:6379
    ports:
      - "8082:8081"
      - "9094:9094"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/busybox/busybox", "wget", "-q", "--spider", "http://localhost:9094/metrics"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cartridge

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - cartridge

  learner:
    build:
      context: ../../services/learner-py
    image: cartridge/learner-py:local
    command: ["--config", "/config/learner.yaml"]
    ports:
      - "9001:9001"
    volumes:
      - learner-checkpoints:/checkpoints
      - ../../configs/runtime/local/learner.yaml:/config/learner.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:9001/metrics || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      replay:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cartridge

  actor:
    build:
      context: ../..
      dockerfile: dockerfiles/rust.Dockerfile
      args:
        SERVICE_NAME: actor-rust
        BINARY_NAME: actor
        USER_NAME: actor
    image: cartridge/actor-rust:local
    environment:
      ACTOR_ENGINE_ADDR: http://engine:50051
      ACTOR_REPLAY_ADDR: http://replay:8080
      ACTOR_ACTOR_ID: actor-rust-1
      ACTOR_ENV_ID: tictactoe
      ACTOR_MAX_EPISODES: "-1"
      ACTOR_BATCH_SIZE: "64"
      ACTOR_FLUSH_INTERVAL: "5"
      ACTOR_LOG_LEVEL: info
      ACTOR_METRICS_ADDR: 0.0.0.0:9002
    ports:
      - "9002:9002"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:9002/metrics || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    depends_on:
      engine:
        condition: service_healthy
      replay:
        condition: service_healthy
    networks:
      - cartridge

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'
    ports:
      - "9090:9090"
    volumes:
      - ../../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks:
      - observability
      - cartridge
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.2
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - ../../observability/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ../../observability/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ../../observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - observability
    depends_on:
      - prometheus
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.3
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ../../observability/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks:
      - observability
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.3
    container_name: promtail
    command: -config.file=/etc/promtail/config.yml
    ports:
      - "9080:9080"
    volumes:
      - ../../observability/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - observability
      - cartridge
    depends_on:
      - loki
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.3.1
    container_name: tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ../../observability/tempo/tempo-config.yml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks:
      - observability
    restart: unless-stopped

volumes:
  learner-checkpoints:
  redis-data:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:

networks:
  cartridge:
    name: cartridge_local
  observability:
    name: observability_network
