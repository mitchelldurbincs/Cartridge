services:
  engine:
    build:
      context: ../..
      dockerfile: services/engine-rust/Dockerfile
    image: cartridge/engine-rust:local
    environment:
      ENGINE_SERVER_ADDR: 0.0.0.0:50051
      ENGINE_METRICS_ADDR: 0.0.0.0:9000
    ports:
      - "50051:50051"
      - "9000:9000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:9000/metrics || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - cartridge

  replay:
    build:
      context: ../..
      dockerfile: services/replay-go/Dockerfile
    image: cartridge/replay-go:local
    command: ["replay-server", "-port", "8080", "-max-size", "200000"]
    environment:
      REPLAY_PORT: "8080"
      REPLAY_MAX_SIZE: "200000"
      REPLAY_METRICS_PORT: "9090"
    ports:
      - "8081:8080"
      - "9090:9090"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/metrics > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cartridge

  orchestrator:
    build:
      context: ../..
      dockerfile: services/orchestrator-go/Dockerfile
    image: cartridge/orchestrator-go:local
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      READ_TIMEOUT: 30s
      WRITE_TIMEOUT: 30s
      SHUTDOWN_TIMEOUT: 30s
      NATS_URL: nats://localhost:4222
      NATS_SUBJECT: run-status
      HEALTH_CHECK_INTERVAL: 15s
      HEARTBEAT_STALE_AFTER: 45s
      HEARTBEAT_UNRESPONSIVE: 135s
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/busybox/busybox", "wget", "-q", "--spider", "http://localhost:8080/metrics"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      engine:
        condition: service_healthy
      replay:
        condition: service_healthy
    networks:
      - cartridge

  weights:
    build:
      context: ../..
      dockerfile: services/weights-go/Dockerfile
    image: cartridge/weights-go:local
    environment:
      WEIGHTS_REDIS_ENABLED: "true"
      WEIGHTS_REDIS_ADDRESS: redis:6379
    ports:
      - "8082:8081"
      - "9094:9094"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/busybox/busybox", "wget", "-q", "--spider", "http://localhost:9094/metrics"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cartridge

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - cartridge

  learner:
    build:
      context: ../../services/learner-py
    image: cartridge/learner-py:local
    command: ["--config", "/config/learner.yaml"]
    ports:
      - "9001:9001"
    volumes:
      - learner-checkpoints:/checkpoints
      - ../../configs/runtime/local/learner.yaml:/config/learner.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:9001/metrics || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      replay:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cartridge

  actor:
    build:
      context: ../..
      dockerfile: services/actor-rust/Dockerfile
    image: cartridge/actor-rust:local
    environment:
      ACTOR_ENGINE_ADDR: http://engine:50051
      ACTOR_REPLAY_ADDR: http://replay:8080
      ACTOR_ACTOR_ID: actor-rust-1
      ACTOR_ENV_ID: tictactoe
      ACTOR_BATCH_SIZE: "64"
      ACTOR_FLUSH_INTERVAL: "5"
      ACTOR_LOG_LEVEL: info
      ACTOR_METRICS_ADDR: 0.0.0.0:9002
    ports:
      - "9002:9002"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:9002/metrics || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    depends_on:
      engine:
        condition: service_healthy
      replay:
        condition: service_healthy
      learner:
        condition: service_healthy
    networks:
      - cartridge

volumes:
  learner-checkpoints:
  redis-data:

networks:
  cartridge:
    name: cartridge_local
